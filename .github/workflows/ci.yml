name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  sast:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run SAST Scan against app/
        run: |
          bandit -r app/ -f json -o sast.bandit.json || true
          # Fail on High or Medium severity findings
          bandit -r app/ -ll

      - name: Upload SAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast.bandit.json
          path: sast.bandit.json

  sca:
    name: SCA Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & pip-audit
        run: pip install pip-audit

      - name: Run SCA Scan against requirements.txt
        run: |
          pip-audit -r requirements.txt -f json -o sca.pip-audit.json || true

      - name: Upload SCA Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca.pip-audit.json
          path: sca.pip-audit.json

  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vulntracker-api:latest .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "vulntracker-api:latest"
          format: "json"
          output: "container.trivy.json"
          exit-code: "0"

      - name: Upload Container Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container.trivy.json
          path: container.trivy.json

  iac-scan:
    name: Infrastructure-as-Code Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy IaC scan on Helm chart
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "helm"
          format: "json"
          output: "iac.trivy.json"
          exit-code: "0"

      - name: Upload IaC Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac.trivy.json
          path: iac.trivy.json
